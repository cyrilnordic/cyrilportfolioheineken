<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cyril Forot Portfolio</title>
  <meta name="description" content="">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The bottle. Animated by js/bottle.js.-->
  <aside class="rail" aria-hidden="true">
    <div class="bottle" id="bottle"><canvas id="bc"></canvas></div>
  </aside>

  <!-- Everything below is generated from content/site.js by js/render.js -->
  <div class="col">
    <header class="top" id="site-header"></header>
    <main id="top"></main>
    <footer class="end" id="site-footer"></footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" hidden>
    <img id="lbImg" src="" alt="">
    <button type="button" id="lbClose" aria-label="Close photo">&times;</button>
  </div>

  <script src="content/site.js"></script>
  <script src="js/render.js"></script>
  <script src="js/carousel.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/bottle.js"></script>
</body>
</html>
